<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Admin Dashboard - Trinova Innovation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #00d4ff;
            --secondary-color: #00a8e8;
            --dark-bg: #0a1929;
            --light-bg: #1e3a5f;
            --text-light: #ffffff;
            --text-gray: #a0aec0;
            --gradient-2: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1929 0%, #1a3a52 50%, #0d2847 100%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, rgba(26, 31, 58, 0.9), rgba(10, 14, 39, 0.9));
            padding: 40px;
            border-radius: 25px;
            margin-bottom: 40px;
            border: 2px solid rgba(0, 212, 255, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffffff 0%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-gray);
            font-size: 18px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(26, 31, 58, 0.9), rgba(10, 14, 39, 0.9));
            padding: 30px;
            border-radius: 20px;
            border: 2px solid rgba(0, 212, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.3);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            background: var(--gradient-2);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .stat-info h3 {
            font-size: 32px;
            font-weight: 900;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .stat-info p {
            color: var(--text-gray);
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 50px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--gradient-2);
            color: white;
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.6);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4d6d 0%, #c9184a 100%);
            color: white;
            box-shadow: 0 5px 20px rgba(255, 77, 109, 0.4);
        }

        .btn-danger:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(255, 77, 109, 0.6);
        }

        .search-box {
            flex: 1;
            min-width: 300px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: var(--text-light);
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-box i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
        }

        .table-container {
            background: linear-gradient(135deg, rgba(26, 31, 58, 0.9), rgba(10, 14, 39, 0.9));
            border-radius: 25px;
            padding: 30px;
            border: 2px solid rgba(0, 212, 255, 0.2);
            overflow-x: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        thead {
            background: rgba(0, 212, 255, 0.1);
        }

        th {
            padding: 18px 15px;
            text-align: left;
            font-weight: 700;
            color: var(--primary-color);
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            padding: 18px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-light);
        }

        tbody tr {
            transition: all 0.3s ease;
        }

        tbody tr:hover {
            background: rgba(0, 212, 255, 0.05);
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn.view {
            background: rgba(0, 212, 255, 0.2);
            color: var(--primary-color);
        }

        .icon-btn.view:hover {
            background: var(--primary-color);
            color: white;
        }

        .icon-btn.delete {
            background: rgba(255, 77, 109, 0.2);
            color: #ff4d6d;
        }

        .icon-btn.delete:hover {
            background: #ff4d6d;
            color: white;
        }

        .no-users {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-gray);
        }

        .no-users i {
            font-size: 80px;
            color: rgba(0, 212, 255, 0.3);
            margin-bottom: 20px;
        }

        .no-users h3 {
            font-size: 24px;
            margin-bottom: 10px;
            color: var(--text-light);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(26, 31, 58, 0.95), rgba(10, 14, 39, 0.95));
            padding: 40px;
            border-radius: 25px;
            max-width: 600px;
            width: 90%;
            border: 2px solid rgba(0, 212, 255, 0.3);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            position: relative;
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            font-size: 28px;
            background: linear-gradient(135deg, #ffffff 0%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-gray);
            font-size: 28px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: var(--primary-color);
        }

        .user-detail {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0, 212, 255, 0.05);
            border-radius: 12px;
            border-left: 4px solid var(--primary-color);
        }

        .user-detail label {
            display: block;
            color: var(--text-gray);
            font-size: 13px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .user-detail p {
            color: var(--text-light);
            font-size: 16px;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 32px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }

            .search-box {
                min-width: 100%;
            }

            table {
                font-size: 14px;
            }

            th, td {
                padding: 12px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fas fa-user-shield"></i> Admin Dashboard</h1>
            <p>Manage registered users and view analytics</p>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-info">
                    <h3 id="totalUsers">0</h3>
                    <p>Total Users</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <div class="stat-info">
                    <h3 id="todayUsers">0</h3>
                    <p>New Today</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-calendar-week"></i>
                </div>
                <div class="stat-info">
                    <h3 id="weekUsers">0</h3>
                    <p>This Week</p>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search users by name, email, or phone...">
            </div>
            <button class="btn btn-primary" onclick="refreshData()">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
            <button class="btn btn-primary" onclick="exportData()">
                <i class="fas fa-download"></i> Export CSV
            </button>
            <button class="btn btn-danger" onclick="clearAllData()">
                <i class="fas fa-trash"></i> Clear All
            </button>
        </div>

        <!-- Table -->
        <div class="table-container">
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Registered Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data will be inserted here -->
                </tbody>
            </table>
            <div id="noUsers" class="no-users" style="display: none;">
                <i class="fas fa-user-slash"></i>
                <h3>No Users Found</h3>
                <p>No registered users yet. Users will appear here after signup.</p>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>User Details</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody">
                <!-- User details will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        // Load and display users
        function loadUsers() {
            const users = JSON.parse(localStorage.getItem('trinovaUsers') || '[]');
            const tableBody = document.getElementById('tableBody');
            const noUsers = document.getElementById('noUsers');
            const searchInput = document.getElementById('searchInput').value.toLowerCase();

            // Filter users based on search
            const filteredUsers = users.filter(user => 
                user.fullname.toLowerCase().includes(searchInput) ||
                user.email.toLowerCase().includes(searchInput) ||
                user.phone.toLowerCase().includes(searchInput)
            );

            // Update stats
            document.getElementById('totalUsers').textContent = users.length;
            
            const today = new Date().setHours(0, 0, 0, 0);
            const todayUsers = users.filter(u => new Date(u.createdAt).setHours(0, 0, 0, 0) === today);
            document.getElementById('todayUsers').textContent = todayUsers.length;

            const weekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
            const weekUsers = users.filter(u => new Date(u.createdAt) >= weekAgo);
            document.getElementById('weekUsers').textContent = weekUsers.length;

            // Display users
            if (filteredUsers.length === 0) {
                tableBody.innerHTML = '';
                noUsers.style.display = 'block';
                return;
            }

            noUsers.style.display = 'none';
            tableBody.innerHTML = filteredUsers.map((user, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td>${user.fullname}</td>
                    <td>${user.email}</td>
                    <td>${user.phone}</td>
                    <td>${new Date(user.createdAt).toLocaleDateString()}</td>
                    <td>
                        <div class="action-btns">
                            <button class="icon-btn view" onclick="viewUser(${users.indexOf(user)})" title="View Details">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button class="icon-btn delete" onclick="deleteUser(${users.indexOf(user)})" title="Delete User">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // View user details
        function viewUser(index) {
            const users = JSON.parse(localStorage.getItem('trinovaUsers') || '[]');
            const user = users[index];
            
            document.getElementById('modalBody').innerHTML = `
                <div class="user-detail">
                    <label>Full Name</label>
                    <p>${user.fullname}</p>
                </div>
                <div class="user-detail">
                    <label>Email Address</label>
                    <p>${user.email}</p>
                </div>
                <div class="user-detail">
                    <label>Phone Number</label>
                    <p>${user.phone}</p>
                </div>
                <div class="user-detail">
                    <label>Delivery Address</label>
                    <p>${user.address}</p>
                </div>
                <div class="user-detail">
                    <label>Registration Date</label>
                    <p>${new Date(user.createdAt).toLocaleString()}</p>
                </div>
            `;
            
            document.getElementById('userModal').classList.add('active');
        }

        // Close modal
        function closeModal() {
            document.getElementById('userModal').classList.remove('active');
        }

        // Delete user
        function deleteUser(index) {
            if (confirm('Are you sure you want to delete this user?')) {
                let users = JSON.parse(localStorage.getItem('trinovaUsers') || '[]');
                users.splice(index, 1);
                localStorage.setItem('trinovaUsers', JSON.stringify(users));
                loadUsers();
            }
        }

        // Clear all data
        function clearAllData() {
            if (confirm('⚠️ WARNING: This will delete ALL user data permanently. Are you sure?')) {
                if (confirm('This action cannot be undone. Continue?')) {
                    localStorage.removeItem('trinovaUsers');
                    loadUsers();
                    alert('All user data has been cleared.');
                }
            }
        }

        // Refresh data
        function refreshData() {
            loadUsers();
            alert('Data refreshed successfully!');
        }

        // Export to CSV
        function exportData() {
            const users = JSON.parse(localStorage.getItem('trinovaUsers') || '[]');
            
            if (users.length === 0) {
                alert('No data to export!');
                return;
            }

            let csv = 'Full Name,Email,Phone,Address,Registration Date\n';
            users.forEach(user => {
                csv += `"${user.fullname}","${user.email}","${user.phone}","${user.address}","${new Date(user.createdAt).toLocaleString()}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `trinova_users_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', loadUsers);

        // Close modal on outside click
        document.getElementById('userModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Initial load
        loadUsers();
    </script>
</body>
</html>
